name: MahjongScore
options:
  bundleIdPrefix: tw.quilaty
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "麻將計分"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSCameraUsageDescription: "用於拍攝麻將牌面，未來提供自動辨識台數功能"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MahjongScore:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: MahjongScore
      - path: ../index.html
        group: MahjongScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.quilaty.mahjongscore
